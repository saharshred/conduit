name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conduit
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U conduit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go vet
        run: go vet ./...

      - name: Unit tests (no infra required)
        run: go test ./internal/ingest/... ./internal/normalize/... -v

      - name: Race detector
        run: go test -race ./internal/ingest/... ./internal/normalize/...

      - name: Apply schema
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-client
          psql postgres://conduit:conduit@localhost:5434/conduit?sslmode=disable -f migrations/0001_ingest.sql
          psql postgres://conduit:conduit@localhost:5434/conduit?sslmode=disable -f migrations/0002_add_city.sql

      - name: Postgres integration tests
        env:
          CONDUIT_TEST_DSN: postgres://conduit:conduit@localhost:5434/conduit?sslmode=disable
        run: go test ./internal/pgingest/... -v

      - name: Build every binary
        run: |
          go build -o /dev/null ./cmd/mockbanks
          go build -o /dev/null ./cmd/normalizer
          go build -o /dev/null ./cmd/ingestor
          go build -o /dev/null ./scripts/gen-dataset

  elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scorer
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - run: mix deps.get
      - run: mix test

  rails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conduit
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U conduit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CONDUIT_DB_HOST: localhost
      CONDUIT_DB_PORT: "5434"
      CONDUIT_DB_USER: conduit
      CONDUIT_DB_PASSWORD: conduit
      CONDUIT_DB_NAME: conduit
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: services/dashboard

      # db/schema.rb (see the root README for why it has to be accurate)
      # already includes transactions + city + flagged_transactions, so
      # db:test:prepare is enough — no need to separately run the Go
      # side's raw SQL migrations in this job.
      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test

  ml-scorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml_scorer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
      - run: pytest -v

  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up and check transactions actually landed
        run: |
          docker compose up --build -d
          echo "waiting for the normalizer to feed transactions through..."
          # Threshold is deliberately low (100, not the full ~10,080) and
          # the timeout generous (8 min) — this is a smoke test proving
          # the whole pipeline actually functions end to end on a fresh
          # machine, not a throughput benchmark. Shared CI runners are
          # meaningfully slower than a laptop for this kind of I/O-heavy
          # multi-container workload.
          timeout 480 bash -c '
            until [ "$(docker compose exec -T postgres psql -U conduit -d conduit -tAc "SELECT count(*) FROM transactions" 2>/dev/null || echo 0)" -gt "100" ]; do
              sleep 10
            done
          ' || { echo "::error::timed out waiting for transactions to land"; docker compose logs; docker compose down -v; exit 1; }
          docker compose exec -T postgres psql -U conduit -d conduit -c "SELECT count(*), count(city) FROM transactions;"

          echo "waiting for the scorer to flag something..."
          timeout 120 bash -c '
            until [ "$(docker compose exec -T postgres psql -U conduit -d conduit -tAc "SELECT count(*) FROM flagged_transactions" 2>/dev/null || echo 0)" -gt "0" ]; do
              sleep 5
            done
          ' || { echo "::error::scorer never flagged anything"; docker compose logs scorer; docker compose down -v; exit 1; }

          echo "firing a labeled attack burst so ml-scorer has ground truth to train on..."
          docker compose run --rm attack --account acct-smoke-test --count 20 --interval 0.1

          echo "waiting for ml-scorer to train and score at least one flagged transaction..."
          timeout 180 bash -c '
            until [ "$(docker compose exec -T postgres psql -U conduit -d conduit -tAc "SELECT count(*) FROM flagged_transactions WHERE ml_score IS NOT NULL" 2>/dev/null || echo 0)" -gt "0" ]; do
              sleep 5
            done
          ' || { echo "::error::ml-scorer never wrote a score"; docker compose logs ml-scorer; docker compose down -v; exit 1; }

          echo "checking the dashboard actually serves the flagged transactions..."
          curl -sf http://localhost:3001/ | grep -q "Flagged transactions" \
            || { echo "::error::dashboard did not render as expected"; docker compose logs dashboard; docker compose down -v; exit 1; }

          docker compose down -v

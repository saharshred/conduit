
# One command, the whole system: `docker compose up --build`.
# Brings up Postgres/RabbitMQ, migrates the schema, generates a mock
# 6-week dataset, starts the three mock banks + the ingestor (which
# deliberately fails ~8% of deliveries to exercise the retry/dead-letter
# path — see internal/queue), runs the normalizer to feed everything in,
# then starts the Elixir scorer (polling every 5s, forever) and the Rails
# dashboard. Open http://localhost:3001 for the live dashboard, and
# http://localhost:15673 (guest/guest) to watch queue depths.
#
# To attack it: `docker compose run --rm attack --account acct-demo --count 20`
# then refresh the dashboard within ~10s and watch it light up.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies both migrations, then exits.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "/migrations/apply.sh"]

  # One-shot: writes a 6-week synthetic dataset per mock bank, then exits.
  gen-dataset:
    build: { context: ., dockerfile: Dockerfile }
    entrypoint: ["/usr/local/bin/gen-dataset"]
    command: ["-weeks", "6", "-per-day", "80", "-out", "/data/"]
    volumes:
      - dataset:/data

  mockbanks:
    build: { context: ., dockerfile: Dockerfile }
    entrypoint: ["/usr/local/bin/mockbanks", "/data/"]
    volumes:
      - dataset:/data
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
    depends_on:
      gen-dataset:
        condition: service_completed_successfully

  ingestor:
    build: { context: ., dockerfile: Dockerfile }
    entrypoint: ["/usr/local/bin/ingestor"]
    command:
      - -rabbitmq=amqp://guest:guest@rabbitmq:5672/
      - -postgres=postgres://conduit:conduit@postgres:5432/conduit?sslmode=disable
      - -inject-failures=true
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # One-shot: fetches everything from the three mock banks and publishes
  # it to RabbitMQ, then exits.
  normalizer:
    build: { context: ., dockerfile: Dockerfile }
    entrypoint: ["/usr/local/bin/normalizer"]
    command:
      - -bank-a=http://mockbanks:8081
      - -bank-b=http://mockbanks:8082
      - -bank-c=http://mockbanks:8083
      - -rabbitmq=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mockbanks:
        condition: service_started
      ingestor:
        condition: service_started

  scorer:
    build: { context: services/scorer, dockerfile: Dockerfile }
    environment:
      CONDUIT_DSN: postgres://conduit:conduit@postgres:5432/conduit
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: { context: services/dashboard, dockerfile: Dockerfile.dev }
    environment:
      CONDUIT_DB_HOST: postgres
      CONDUIT_DB_PORT: "5432"
      CONDUIT_DB_USER: conduit
      CONDUIT_DB_PASSWORD: conduit
      CONDUIT_DB_NAME: conduit
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Run on demand: `docker compose run --rm attack --account acct-demo --count 20`
  attack:
    build: { context: attack, dockerfile: Dockerfile }
    entrypoint: ["python", "attack.py", "--amqp-url=amqp://guest:guest@rabbitmq:5672/"]
    profiles: ["tools"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Second-stage classifier on top of the rule engine: trains once at
  # startup against real ground truth (attack/attack.py's own labels,
  # same trick services/scorer/lib/scorer/evaluate.ex uses), then loops
  # scoring newly rule-flagged transactions. Waits on the normalizer to
  # finish feeding transactions in so it has real history to train on.
  ml-scorer:
    build: { context: services/ml_scorer, dockerfile: Dockerfile }
    environment:
      CONDUIT_DSN: postgres://conduit:conduit@postgres:5432/conduit
    volumes:
      - ml-model:/model
    depends_on:
      normalizer:
        condition: service_completed_successfully
      scorer:
        condition: service_started

volumes:
  pgdata:
  dataset:
  ml-model:

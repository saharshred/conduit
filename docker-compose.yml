version: "3.9"

# Day 5 target. rabbitmq's management UI is exposed for watching the
# retry/dead-letter queues fill up live during the Day 6 attack demo.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management UI

  mockbanks:
    build:
      context: .
      dockerfile: Dockerfile.mockbanks
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"

  normalizer:
    build:
      context: .
      dockerfile: Dockerfile.normalizer
    depends_on:
      - mockbanks
      - rabbitmq

volumes:
  pgdata:
